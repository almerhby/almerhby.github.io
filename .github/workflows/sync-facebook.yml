name: Sync Facebook Articles

on:
  # التشغيل التلقائي 3 مرات يومياً (09:00 ص، 04:00 م، 11:00 م بتوقيت مكة واليمن)
  schedule:
    - cron: '0 6,13,20 * * *'

  # زر تشغيل يدوي فوري من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fetch and Update Facebook Articles
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل كود المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تشغيل محرك سحب منشورات فيسبوك
        run: node scripts/sync-facebook.js

      - name: حفظ التغييرات وتحديث الموقع
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/article-index.js assets/data/article-content.js assets/data/core.js assets/images/articles/ sitemap.xml
          if git diff --staged --quiet; then
            echo "لا توجد مقالات جديدة. كل شيء محدث."
          else
            git commit -m "تحديث تلقائي: مزامنة مقالات فيسبوك الجديدة [skip ci]"
            git push origin main
          fi
